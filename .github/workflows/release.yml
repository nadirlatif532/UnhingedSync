name: Release

# Three ways to trigger this, because a tag push alone has proven unreliable: v1.3.0
# matched the pattern below, existed on the remote, and never fired a run -- a missed
# webhook delivery, not a config problem, but one with no retry short of a workaround.
#
#   1. Push a tag like v1.3.0 (git tag v1.3.0 && git push origin v1.3.0).
#   2. Publish a GitHub Release through the web UI; its tag is used automatically.
#   3. Run it manually: gh workflow run release.yml -f version=1.3.0
#      or from the Actions tab, which works even if 1 and 2 both go quiet again.
#
# Whatever triggers it, the app's own update checker polls GitHub's "latest release"
# endpoint, so whatever lands here is what every teammate is offered next time they
# open the tool.
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.3.0 (no leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The version is the single source of truth, whichever of the three triggers fired.
      # Left to the csproj, a forgotten bump ships a release whose exe still reports the
      # old version, and every teammate is offered the same update forever because
      # installing it never changes what they report.
      #
      # Every source reaches the script through the environment, never by interpolation.
      # A tag or a manual input is attacker-controllable text, and ${{ }} would paste it
      # straight into a shell running with contents: write.
      - name: Derive version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          $raw = switch ($env:EVENT_NAME) {
            'release'          { $env:RELEASE_TAG }
            'workflow_dispatch' { $env:DISPATCH_VERSION }
            default            { $env:REF_NAME }
          }
          $v = $raw -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "'$raw' is not vMAJOR.MINOR.PATCH" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v (trigger: $env:EVENT_NAME)"

      - name: Publish self-contained exe
        run: >
          dotnet publish src/UnhingedSync/UnhingedSync.csproj -c Release -o dist
          -p:Version=${{ steps.version.outputs.value }}

      # Guards against the failure this whole step exists to prevent: if the built exe
      # does not report the intended version, the release is wrong and must not ship.
      - name: Verify stamped version
        shell: pwsh
        env:
          WANT: ${{ steps.version.outputs.value }}
        run: |
          $actual = (Get-Item dist/UnhingedSync.exe).VersionInfo.FileVersion
          Write-Host "exe reports $actual, expected $env:WANT"
          if ($actual -ne "$env:WANT.0") { throw "Version mismatch: exe=$actual want=$env:WANT" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/UnhingedSync.exe -DestinationPath UnhingedSync.zip -Force

      # tag_name is explicit rather than left to default from GITHUB_REF, because a manual
      # or release-triggered run may have no tag ref of its own to fall back on. Pointing
      # it at the derived version means all three triggers land on the same tag, and
      # re-running this after a release was already published updates its assets instead
      # of failing on a tag that exists.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: UnhingedSync.zip
          generate_release_notes: true
